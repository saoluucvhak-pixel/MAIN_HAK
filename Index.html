<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --sidebar-bg: #1f2937;
      --sidebar-bg-hover: #2d3a4d;
      --sidebar-active: #2563eb;
      --sidebar-text: #cbd5e1;
      --sidebar-text-dim: #8b98ab;
      --content-bg: #f3f4f6;
      --card-bg: #ffffff;
      --border: #e5e7eb;
      --danger: #dc2626;
      --warn: #b45309;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--content-bg);
    }
    .layout { display: flex; height: 100vh; width: 100vw; overflow: hidden; }

    .sidebar {
      width: 270px; flex-shrink: 0;
      background: var(--sidebar-bg);
      color: var(--sidebar-text);
      display: flex; flex-direction: column;
      padding: 20px 0;
      overflow-y: auto;
    }
    .sidebar-header {
      padding: 0 20px 20px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 12px;
    }
    .sidebar-header .title { font-size: 17px; font-weight: 700; color: #fff; }
    .sidebar-header .subtitle { font-size: 12px; color: var(--sidebar-text-dim); margin-top: 2px; }

    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 20px; cursor: pointer;
      border-left: 3px solid transparent;
      transition: background 0.15s;
    }
    .nav-item:hover { background: var(--sidebar-bg-hover); }
    .nav-item.active {
      background: var(--sidebar-bg-hover);
      border-left-color: var(--sidebar-active);
      color: #fff;
    }
    .nav-item.disabled { opacity: 0.45; cursor: not-allowed; }
    .nav-item .icon { font-size: 17px; width: 20px; text-align: center; flex-shrink: 0; }
    .nav-item .name { font-size: 13.5px; font-weight: 600; flex: 1; }
    .nav-item .chevron { font-size: 10px; color: var(--sidebar-text-dim); transition: transform 0.15s; }
    .nav-item.expanded .chevron { transform: rotate(90deg); }

    .nav-children { display: none; }
    .nav-children.open { display: block; }
    .nav-children .nav-item { padding-left: 44px; }
    .nav-children .nav-item .name { font-size: 12.5px; font-weight: 500; }

    .content { flex: 1; display: flex; flex-direction: column; min-width: 0; }

    .content-header {
      height: 52px; flex-shrink: 0;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px;
    }
    .content-header .current-name { font-size: 15px; font-weight: 700; color: #111827; }
    .content-header .reload-btn {
      font-size: 12px; color: #6b7280; cursor: pointer;
      border: 1px solid var(--border); border-radius: 6px;
      padding: 5px 10px; background: #fafafa;
    }
    .content-header .reload-btn:hover { background: #f0f0f0; }

    .frame-area { flex: 1; position: relative; overflow: auto; }
    iframe {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; border: none; display: none;
    }
    iframe.active { display: block; }

    .panel {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      overflow: auto; padding: 40px;
    }
    .center-panel {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; color: #6b7280; height: 100%;
    }
    .center-panel .big-icon { font-size: 48px; margin-bottom: 12px; }
    .center-panel h2 { color: #111827; margin: 0 0 6px 0; }
    .center-panel.warn h2 { color: var(--warn); }
    .center-panel.danger h2 { color: var(--danger); }
    .center-panel code {
      background: #f3f4f6; color: #374151; padding: 2px 6px;
      border-radius: 4px; font-size: 12px;
    }

    .guide-card, .admin-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 24px; max-width: 720px; margin: 0 auto;
    }
    .guide-card h2 { margin-top: 0; }
    .admin-table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
    .admin-table th, .admin-table td {
      text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border);
    }
    .admin-table th { color: #6b7280; font-weight: 600; }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 11px; font-weight: 600;
    }
    .badge.default { background: #e5e7eb; color: #374151; }
    .badge.override { background: #dbeafe; color: #1d4ed8; }
    .url-edit-input {
      width: 100%; font-size: 12px; padding: 5px 7px;
      border: 1px solid var(--border); border-radius: 4px; font-family: monospace;
    }
    .save-url-btn, .reset-url-btn {
      font-size: 11px; padding: 4px 9px; border-radius: 4px;
      border: 1px solid var(--border); background: #fafafa; cursor: pointer;
      margin-right: 4px; white-space: nowrap;
    }
    .save-url-btn:hover, .reset-url-btn:hover { background: #f0f0f0; }

    .frame-status {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--content-bg);
    }
    .retry-btn {
      margin-top: 14px; font-size: 13px; color: #fff; cursor: pointer;
      border: none; border-radius: 6px; padding: 8px 16px; background: var(--sidebar-active);
    }
    .retry-btn:hover { opacity: 0.9; }

    .login-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 28px; max-width: 420px; margin: 60px auto;
      text-align: center;
    }
    .login-card .btn-google {
      display: inline-block; margin-top: 14px; padding: 10px 22px;
      background: var(--sidebar-active); color: #fff; border-radius: 8px;
      text-decoration: none; font-weight: 600; font-size: 13.5px;
    }
    .login-card .login-err { color: var(--danger); font-size: 13px; margin-top: 10px; }
    .login-card .login-hint { color: #6b7280; font-size: 12.5px; margin-top: 10px; }

    .quantri-tabs { display: flex; gap: 4px; margin-bottom: 16px; }
    .quantri-tabs button {
      border: 1px solid var(--border); background: #fafafa; cursor: pointer;
      padding: 7px 14px; font-size: 12.5px; font-weight: 600; border-radius: 6px;
      color: #374151;
    }
    .quantri-tabs button.active { background: var(--sidebar-active); color: #fff; border-color: var(--sidebar-active); }
    .nguoidung-chip {
      display: inline-flex; align-items: center; gap: 8px; font-size: 12px;
      color: #6b7280; margin-bottom: 14px;
    }
    .nguoidung-chip .dang-xuat-btn {
      border: 1px solid var(--border); background: #fff; border-radius: 5px;
      font-size: 11px; padding: 3px 8px; cursor: pointer;
    }
    .form-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .form-row input, .form-row select { font-size: 12.5px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; }
    .form-row input[type="email"] { flex: 1; min-width: 200px; }
    .admin-card.rong { max-width: 1000px; }
    .th-section { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
    .th-section h3 { margin: 0 0 8px; font-size: 14px; }
    .th-mota { color: #6b7280; font-size: 11.5px; margin-top: 2px; }
    .th-lich select, .th-lich input { font-size: 11.5px; padding: 3px 4px; border: 1px solid var(--border); border-radius: 4px; }
    .th-ok { color: #16a34a; } .th-loi { color: #dc2626; }
    .th-link-btn {
      display: inline-block; font-size: 12px; padding: 6px 12px; border-radius: 5px; margin: 0 6px 6px 0;
      border: 1px solid var(--border); background: #fafafa; color: #374151; text-decoration: none;
    }
    .th-link-btn:hover { background: #f0f0f0; }
    .cong-textarea {
      width: 100%; height: 220px; font-family: monospace; font-size: 11.5px;
      padding: 10px; border: 1px solid var(--border); border-radius: 6px; margin-top: 8px;
    }
  </style>
</head>
<body data-phien="<?= phien ?>" data-loi-dang-nhap="<?= loiDangNhap ?>">

  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="title">HAK Group</div>
        <div class="subtitle">Portal điều hướng</div>
      </div>
      <div id="nav-list"></div>
    </div>

    <div class="content">
      <div class="content-header">
        <div class="current-name" id="current-name">Trang chủ</div>
        <div class="reload-btn" id="reload-btn" style="display:none;">↻ Tải lại</div>
      </div>
      <div class="frame-area" id="frame-area">
        <div class="panel center-panel" id="welcome-screen">
          <div class="big-icon">🏠</div>
          <h2>Chào mừng đến HAK Portal</h2>
          <div>Chọn một mục ở menu bên trái để bắt đầu.</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    var menu = [];
    var currentId = null;
    var expanded = {};
    var frameState = {}; // id -> { loaded: bool, timer: number }
    var LOAD_TIMEOUT_MS = 12000;

    /* ============================================================
     * ĐĂNG NHẬP GMAIL (chỉ khu Quản trị) — xem chú thích trong Code.gs.
     * Mọi lời gọi khu Quản trị đi qua call(tenChucNang, thamSo), tự kèm
     * PHIEN và tự hiện màn đăng nhập nếu lỗi bắt đầu bằng "[AUTH] ".
     * ============================================================ */
    var PHIEN_STORAGE_KEY = 'hak_portal_phien';
    var LOI_DANG_NHAP_PREFIX = '[AUTH] ';
    var PHIEN = '';

    function khoiTaoPhien() {
      var tuServer = document.body.dataset.phien || '';
      if (tuServer) {
        PHIEN = tuServer;
        try { sessionStorage.setItem(PHIEN_STORAGE_KEY, PHIEN); } catch (e) {}
      } else {
        try { PHIEN = sessionStorage.getItem(PHIEN_STORAGE_KEY) || ''; } catch (e) { PHIEN = ''; }
      }
    }
    khoiTaoPhien();

    /** Gọi 1 chức năng khu Quản trị qua api(PHIEN, tenHam, thamSo). Trả Promise. */
    function call(tenHam, thamSo) {
      return new Promise(function (resolve, reject) {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          .api(PHIEN, tenHam, thamSo || []);
      });
    }
    function laLoiDangNhap(err) {
      return !!(err && err.message && err.message.indexOf(LOI_DANG_NHAP_PREFIX) === 0);
    }
    function noiDungLoi(err, tienTo) {
      var msg = (err && err.message) || String(err);
      var i = msg.indexOf(tienTo);
      return i >= 0 ? msg.slice(i + tienTo.length) : msg;
    }

    function findItem(id, list) {
      list = list || menu;
      for (var i = 0; i < list.length; i++) {
        if (list[i].id === id) return list[i];
        if (list[i].children) {
          var found = findItem(id, list[i].children);
          if (found) return found;
        }
      }
      return null;
    }

    function findItemByUrlKey(key, list) {
      list = list || menu;
      for (var i = 0; i < list.length; i++) {
        if (list[i].urlKey === key) return list[i];
        if (list[i].children) {
          var found = findItemByUrlKey(key, list[i].children);
          if (found) return found;
        }
      }
      return null;
    }

    function renderNavNode(item, container, isChild) {
      var row = document.createElement('div');
      row.className = 'nav-item' + (item.id === currentId ? ' active' : '') +
        (item.type === 'link' && !item.url ? ' disabled' : '') +
        (item.type === 'group' && expanded[item.id] ? ' expanded' : '');
      row.innerHTML =
        '<div class="icon">' + (item.icon || '') + '</div>' +
        '<div class="name">' + item.name + '</div>' +
        (item.type === 'group' ? '<div class="chevron">▶</div>' : '');
      row.onclick = function () {
        if (item.type === 'group') {
          expanded[item.id] = !expanded[item.id];
          render();
        } else {
          selectItem(item.id);
        }
      };
      container.appendChild(row);

      if (item.type === 'group' && item.children) {
        var childWrap = document.createElement('div');
        childWrap.className = 'nav-children' + (expanded[item.id] ? ' open' : '');
        item.children.forEach(function (child) {
          renderNavNode(child, childWrap, true);
        });
        container.appendChild(childWrap);
      }
    }

    function render() {
      var navList = document.getElementById('nav-list');
      navList.innerHTML = '';
      menu.forEach(function (item) { renderNavNode(item, navList, false); });
    }

    function clearMissingMsg() {
      var m = document.getElementById('dynamic-panel');
      if (m) m.remove();
    }

    function clearFrameStatus() {
      var s = document.getElementById('frame-status');
      if (s) s.remove();
    }

    function showFrameLoading(id, name) {
      clearFrameStatus();
      var wrap = document.createElement('div');
      wrap.className = 'frame-status panel center-panel';
      wrap.id = 'frame-status';
      wrap.innerHTML = '<div class="big-icon">⏳</div><h2>Đang tải "' + name + '"...</h2>';
      document.getElementById('frame-area').appendChild(wrap);
    }

    function showFrameError(id, name, url) {
      clearFrameStatus();
      var wrap = document.createElement('div');
      wrap.className = 'frame-status panel center-panel danger';
      wrap.id = 'frame-status';
      wrap.innerHTML = '<div class="big-icon">⚠️</div><h2>Không tải được "' + name + '"</h2>' +
        '<div>URL hiện tại có thể sai hoặc hệ thống con chưa cho phép nhúng iframe:<br><code>' + url + '</code></div>' +
        '<button class="retry-btn" id="retry-btn">↻ Thử lại</button>';
      document.getElementById('retry-btn').onclick = function () { retryFrame(id, name, url); };
    }

    function armFrameTimer(id, name, url) {
      if (frameState[id].timer) clearTimeout(frameState[id].timer);
      frameState[id].timer = setTimeout(function () {
        if (!frameState[id].loaded && currentId === id) {
          showFrameError(id, name, url);
        }
      }, LOAD_TIMEOUT_MS);
    }

    function retryFrame(id, name, url) {
      var frame = document.getElementById('frame-' + id);
      if (!frame) return;
      frameState[id].loaded = false;
      showFrameLoading(id, name);
      armFrameTimer(id, name, url);
      frame.src = url;
    }

    // Công cụ độc lập (type:'tool') nhúng bằng srcdoc thay vì src — nội dung lấy
    // từ getToolContent() phía server, không phải URL bên ngoài, nên không dùng
    // chung cơ chế timeout/X-Frame-Options của iframe 'link'.
    function loadToolIntoFrame(id, item) {
      showFrameLoading(id, item.name);
      google.script.run
        .withSuccessHandler(function (html) {
          var frame = document.getElementById('frame-' + id);
          if (frame) frame.srcdoc = html;
          if (currentId === id) clearFrameStatus();
        })
        .withFailureHandler(function (err) {
          if (currentId !== id) return;
          clearFrameStatus();
          var wrap = document.createElement('div');
          wrap.className = 'frame-status panel center-panel danger';
          wrap.id = 'frame-status';
          wrap.innerHTML = '<div class="big-icon">⚠️</div><h2>Không tải được "' + item.name + '"</h2>' +
            '<div>' + (err && err.message ? err.message : 'Có lỗi khi tải công cụ.') + '</div>' +
            '<button class="retry-btn" id="retry-btn">↻ Thử lại</button>';
          document.getElementById('frame-area').appendChild(wrap);
          document.getElementById('retry-btn').onclick = function () { loadToolIntoFrame(id, item); };
        })
        .getToolContent(item.toolFile);
    }

    function escapeAttr(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
    }

    var quantriTab = 'url'; // 'url' | 'nguoidung' | 'cong'

    /** Điểm vào khu Quản trị: kiểm tra đăng nhập trước (thongTinDangNhap
     * không cần đăng nhập, chỉ trả trạng thái của chính người gọi). */
    function renderAdminPanel() {
      var loiBanDau = window.__loiDangNhapBanDau || '';
      window.__loiDangNhapBanDau = ''; // chỉ hiện 1 lần ngay sau khi quay lại từ Cổng đăng nhập
      google.script.run
        .withSuccessHandler(function (nd) {
          if (!nd.daDangNhap || nd.vaiTro !== 'ADMIN') {
            hienManHinhDangNhapQuanTri(nd, loiBanDau);
            return;
          }
          renderQuanTriDaDangNhap(nd);
        })
        .withFailureHandler(function () { hienManHinhDangNhapQuanTri({ congDangNhapUrl: '' }, loiBanDau); })
        .thongTinDangNhap(PHIEN);
    }

    function hienManHinhDangNhapQuanTri(nd, loi) {
      var cong = (nd && nd.congDangNhapUrl) || '';
      showCardPanel(
        '<div class="login-card"><h2>🔐 Đăng nhập Quản trị</h2>' +
        '<div class="login-hint">Khu Quản trị (sửa URL, quản lý người dùng) yêu cầu đăng nhập bằng tài khoản Google đã được cấp quyền.</div>' +
        (loi ? '<div class="login-err">' + escapeAttr(loi) + '</div>' : '') +
        (!cong
          ? '<div class="login-hint" style="margin-top:14px;">Chưa cấu hình Cổng đăng nhập. Nếu bạn là chủ hệ thống, mở Portal trực tiếp (không qua link đăng nhập) — bạn sẽ tự động là Quản trị nếu email nằm trong Script Property <code>ADMIN_EMAILS</code>.</div>'
          : '<a class="btn-google" href="' + escapeAttr(cong) + '" target="_top">Đăng nhập bằng Google</a>') +
        '</div>'
      );
    }

    function renderQuanTriDaDangNhap(nd) {
      showCardPanel(
        '<div class="admin-card' + (quantriTab === 'tonghop' ? ' rong' : '') + '">' +
        '<div class="nguoidung-chip">👤 ' + escapeAttr(nd.email) + ' (Quản trị)' +
        '<button class="dang-xuat-btn" id="btn-dang-xuat">Đăng xuất</button></div>' +
        '<h2>⚙️ Quản trị</h2>' +
        '<div class="quantri-tabs">' +
        '<button data-tab="url" class="' + (quantriTab === 'url' ? 'active' : '') + '">Hệ thống con</button>' +
        '<button data-tab="nguoidung" class="' + (quantriTab === 'nguoidung' ? 'active' : '') + '">Người dùng</button>' +
        '<button data-tab="cong" class="' + (quantriTab === 'cong' ? 'active' : '') + '">Cổng đăng nhập</button>' +
        '<button data-tab="tonghop" class="' + (quantriTab === 'tonghop' ? 'active' : '') + '">Bảng tổng hợp</button>' +
        '</div>' +
        '<div id="quantri-body">Đang tải...</div></div>'
      );
      document.getElementById('btn-dang-xuat').onclick = dangXuatQuanTri;
      document.querySelectorAll('.quantri-tabs button').forEach(function (btn) {
        btn.onclick = function () { quantriTab = btn.getAttribute('data-tab'); renderQuanTriDaDangNhap(nd); };
      });
      if (quantriTab === 'url') renderTabUrl();
      else if (quantriTab === 'nguoidung') renderTabNguoiDung();
      else if (quantriTab === 'tonghop') renderTabTongHop();
      else renderTabCongDangNhap();
    }

    function dangXuatQuanTri() {
      google.script.run.withSuccessHandler(function () {}).withFailureHandler(function () {}).dangXuat(PHIEN);
      PHIEN = '';
      try { sessionStorage.removeItem(PHIEN_STORAGE_KEY); } catch (e) {}
      renderAdminPanel();
    }

    /** Sau lỗi [AUTH] ở bất kỳ thao tác Quản trị nào: phiên hết hạn/bị khoá — quay lại màn đăng nhập. */
    function xuLyLoiQuanTri(err) {
      if (laLoiDangNhap(err)) {
        PHIEN = '';
        try { sessionStorage.removeItem(PHIEN_STORAGE_KEY); } catch (e) {}
        google.script.run.withSuccessHandler(function (nd) {
          hienManHinhDangNhapQuanTri(nd, noiDungLoi(err, LOI_DANG_NHAP_PREFIX));
        }).thongTinDangNhap('');
        return true;
      }
      return false;
    }

    // --- Tab "Hệ thống con" (sửa URL) ---
    function renderTabUrl() {
      var body = document.getElementById('quantri-body');
      body.innerHTML = 'Đang tải...';
      call('getAdminInfo', []).then(function (info) {
        var rowsHtml = info.rows.map(function (r) {
          var badgeClass = r.source.indexOf('ghi đè') >= 0 ? 'override' : 'default';
          return '<tr><td>' + r.name + '</td>' +
            '<td><input type="text" id="url-input-' + r.key + '" class="url-edit-input" value="' + escapeAttr(r.url) + '" placeholder="https://script.google.com/macros/s/.../exec"></td>' +
            '<td><span class="badge ' + badgeClass + '">' + r.source + '</span></td>' +
            '<td><button class="save-url-btn" data-key="' + r.key + '">💾 Lưu</button><button class="reset-url-btn" data-key="' + r.key + '">↺ Mặc định</button></td></tr>';
        }).join('');
        body.innerHTML =
          '<div style="color:#6b7280; font-size:13px;">Sửa URL rồi bấm <b>Lưu</b> — áp dụng ngay lập tức, không cần deploy lại Portal.</div>' +
          '<table class="admin-table"><thead><tr><th>Hệ thống</th><th>URL hiện tại</th><th>Nguồn</th><th></th></tr></thead><tbody>' + rowsHtml + '</tbody></table>' +
          '<div id="admin-msg" style="margin-top:10px; font-size:13px;"></div>';
        document.querySelectorAll('.save-url-btn').forEach(function (btn) {
          btn.onclick = function () { saveUrlOverride(btn.getAttribute('data-key'), document.getElementById('url-input-' + btn.getAttribute('data-key')).value); };
        });
        document.querySelectorAll('.reset-url-btn').forEach(function (btn) {
          btn.onclick = function () { saveUrlOverride(btn.getAttribute('data-key'), ''); };
        });

    function selectItem(id) {
      var item = findItem(id);
      if (!item) return;
      currentId = id;
      document.getElementById('current-name').textContent = item.name;
      document.getElementById('reload-btn').style.display = ((item.type === 'link' && item.url) || item.type === 'tool') ? 'inline-block' : 'none';

      if (item.type === 'link') {
        if (!item.url) {
          showCenterPanel('danger', '⚠️', 'Chưa cấu hình URL',
            'Hệ thống "' + item.name + '" chưa có URL.<br>Thêm property <code>' + item.urlKey + '</code> trong Script Properties, hoặc cập nhật <code>DEFAULT_URLS</code> trong Code.gs.');
          render();
          return;
        }
        clearMissingMsg();
        document.getElementById('welcome-screen').style.display = 'none';
        document.querySelectorAll('iframe').forEach(function (f) { f.classList.remove('active'); });
        var frame = document.getElementById('frame-' + id);
        if (!frame) {
          frame = document.createElement('iframe');
          frame.id = 'frame-' + id;
          frameState[id] = { loaded: false, timer: null };
          frame.onload = function () {
            frameState[id].loaded = true;
            if (frameState[id].timer) clearTimeout(frameState[id].timer);
            if (currentId === id) clearFrameStatus();
          };
          document.getElementById('frame-area').appendChild(frame);
          showFrameLoading(id, item.name);
          armFrameTimer(id, item.name, item.url);
          frame.src = item.url;
        } else if (frameState[id] && frameState[id].loaded) {
          clearFrameStatus();
        } else {
          showFrameLoading(id, item.name);
          armFrameTimer(id, item.name, item.url);
        }
        frame.classList.add('active');

      } else if (item.type === 'tool') {
        clearMissingMsg();
        document.getElementById('welcome-screen').style.display = 'none';
        document.querySelectorAll('iframe').forEach(function (f) { f.classList.remove('active'); });
        var toolFrame = document.getElementById('frame-' + id);
        if (!toolFrame) {
          toolFrame = document.createElement('iframe');
          toolFrame.id = 'frame-' + id;
          document.getElementById('frame-area').appendChild(toolFrame);
          loadToolIntoFrame(id, item);
        } else {
          clearFrameStatus();
        }
        toolFrame.classList.add('active');

      } else if (item.type === 'placeholder') {
        showCenterPanel('warn', '🚧', item.name, item.note || 'Đang phát triển.');

      } else if (item.type === 'guide') {
        showCardPanel('<div class="guide-card"><h2>📘 ' + item.name + '</h2><div>' + item.content + '</div></div>');

      } else if (item.type === 'admin') {
        renderAdminPanel();
      }

      render();
    }

    document.getElementById('reload-btn').onclick = function () {
      if (!currentId) return;
      var item = findItem(currentId);
      if (!item) return;
      if (item.type === 'tool') loadToolIntoFrame(currentId, item);
      else if (item.url) retryFrame(currentId, item.name, item.url);
    };

    window.__loiDangNhapBanDau = document.body.dataset.loiDangNhap || '';
    google.script.run.withSuccessHandler(function (result) {
      menu = result;
      render();
      // Vừa quay lại từ Cổng đăng nhập (server vừa cấp phiên mới, hoặc báo
      // lỗi đăng nhập) — mở luôn khu Quản trị, vì chỉ khu này cần đăng nhập
      // nên chắc chắn đó là nơi người dùng đang muốn vào.
      if (document.body.dataset.phien || window.__loiDangNhapBanDau) selectItem('quantri');
    }).getMenu();

    // Xoá ?sso=... khỏi thanh địa chỉ sau khi đã dùng xong (link chỉ dùng
    // được 1 lần, giữ lại trên URL dễ gây nhầm lẫn khi tải lại trang / chia sẻ link).
    if (window.location.search.indexOf('sso=') >= 0 && window.history && window.history.replaceState) {
      window.history.replaceState({}, document.title, window.location.pathname);
    }
  </script>

</body>
</html>
